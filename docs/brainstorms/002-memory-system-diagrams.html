<body>

<!-- Slide 1: 系统全景 -->
<div class="slide">
  <div class="slide-title">mem0ress 架构设计</div>
  <h1>核心概念全景</h1>
  <p class="slide-desc">记忆是有目标属性的。信息通过标签与任务关联，任务的状态快照构成Plane，AI是发现者而非维护者。</p>

  <svg viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg">
    <defs>

        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f8fafc"/>
      </linearGradient>
      <linearGradient id="taskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#6366f1"/>
        <stop offset="100%" stop-color="#4f46e5"/>
      </linearGradient>
      <linearGradient id="infoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#10b981"/>
        <stop offset="100%" stop-color="#059669"/>
      </linearGradient>
      <linearGradient id="planeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#f59e0b"/>
        <stop offset="100%" stop-color="#d97706"/>
      </linearGradient>
      <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#9ca3af"/>
      </marker>
      <marker id="arrowHeadPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/>
      </marker>
      <marker id="arrowHeadGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
      </marker>
    </defs>

    <!-- Background Panel -->
    <rect x="20" y="20" width="1060" height="480" rx="16" fill="url(#bgGrad1)"/>

    <!-- TASK Card -->
    <g transform="translate(60, 80)">
      <rect width="260" height="340" rx="12" fill="url(#cardGrad1)" class="card-shadow"/>
      <rect width="260" height="6" rx="3" fill="url(#taskGrad)" y="0"/>

      <rect x="130" y="180" width="110" height="28" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <text x="140" y="198" font-size="11" fill="#92400e">优化登录逻辑 ●</text>
      <rect x="20" y="216" width="90" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
      <text x="30" y="234" font-size="11" fill="#6b7280">性能测试 ○</text>

      <!-- Note -->

      <text x="20" y="286" class="node-body" fill="#6b7280">递归结构</text>

      <!-- Tags hint -->
      <rect x="20" y="300" width="220" height="24" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="30" y="316" font-size="10" fill="#166534">linked to Info via tags</text>
    </g>

    <!-- Arrow: Task -> Info -->
    <path d="M 340 250 L 400 250" class="arrow" marker-end="url(#arrowHead)"/>
    <text x="355" y="240" fill="#9ca3af" font-size="11">tag matching</text>

    <!-- INFO Card -->
    <g transform="translate(420, 80)">
      <rect width="260" height="340" rx="12" fill="url(#cardGrad1)" class="card-shadow"/>
      <rect width="260" height="6" rx="3" fill="url(#infoGrad)" y="0"/>

      <text x="32" y="92" font-size="10" fill="#065f46" font-weight="600">content 内容</text>
      <text x="32" y="110" class="node-body">"用户反馈: 登录等待3秒"</text>
      <text x="32" y="126" class="node-body">"建议: 改为Redis存储Session"</text>

      <!-- Tags -->
      <text x="20" y="172" class="node-body" fill="#374151" font-weight="500">tags 标签 (AI自动)</text>
      <rect x="20" y="182" width="70" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="32" y="198" font-size="10" fill="#1e40af">性能</text>
      <rect x="98" y="182" width="70" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="110" y="198" font-size="10" fill="#1e40af">登录</text>
      <rect x="176" y="182" width="64" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/>

    </g>

    <!-- Arrow: Info -> Plane -->
    <path d="M 700 250 L 760 250" class="arrow" marker-end="url(#arrowHead)"/>
    <text x="715" y="240" fill="#9ca3af" font-size="11">discovers</text>

    <!-- PLANE Card -->
    <g transform="translate(780, 80)">
      <rect width="260" height="340" rx="12" fill="url(#cardGrad1)" class="card-shadow"/>
      <rect width="260" height="6" rx="3" fill="url(#planeGrad)" y="0"/>
      <rect width="260" height="340" rx="12" fill="none" stroke="#e5e7eb" stroke-width="1"/>
      <text x="20" y="36" class="node-title">Plane 平面</text>
      <text x="20" y="54" class="node-subtitle">Task在时刻T的状态快照</text>

      <!-- Plane content -->
      <rect x="20" y="72" width="220" height="200" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
      <text x="32" y="94" font-size="11" fill="#92400e" font-weight="600">Task: 登录模块</text>
      <text x="32" y="112" font-size="11" fill="#78350f">Picture: "登录<1秒"</text>
      <text x="32" y="130" font-size="11" fill="#78350f">Status: ◉ in-progress</text>
      <line x1="20" y1="142" x2="240" y2="142" stroke="#fde68a" stroke-width="1"/>
      <text x="32" y="158" font-size="10" fill="#92400e">Subtasks:</text>
      <text x="40" y="174" font-size="10" fill="#78350f">✓ OAuth配置</text>
      <text x="40" y="190" font-size="10" fill="#78350f">● 优化登录 ← 当前</text>
      <text x="40" y="206" font-size="10" fill="#78350f">○ 性能测试</text>
      <line x1="20" y1="218" x2="240" y2="218" stroke="#fde68a" stroke-width="1"/>
      <text x="32" y="234" font-size="10" fill="#92400e">Hot Info:</text>
      <text x="40" y="250" font-size="10" fill="#78350f">• 用户反馈(3秒) [性能,P0]</text>
      <text x="40" y="266" font-size="10" fill="#78350f">• Redis建议 [架构]</text>

      <!-- Key insight -->
      <rect x="20" y="288" width="220" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="32" y="306" font-size="10" fill="#92400e" font-weight="600">发现，而非维护</text>
      <text x="32" y="318" font-size="10" fill="#78350f">下一秒状态变了 = 新的Plane</text>
    </g>

    <!-- Legend -->
    <g transform="translate(60, 440)">
      <rect width="980" height="50" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <circle cx="30" cy="25" r="8" fill="url(#taskGrad)"/>
      <text x="46" y="29" fill="#e5e7eb" font-size="12">Task 任务锚点</text>
      <circle cx="200" cy="25" r="8" fill="url(#infoGrad)"/>
      <text x="216" y="29" fill="#e5e7eb" font-size="12">Info 记忆本体</text>
      <circle cx="380" cy="25" r="8" fill="url(#planeGrad)"/>
      <text x="396" y="29" fill="#e5e7eb" font-size="12">Plane 状态快照</text>
      <text x="520" y="29" fill="#9ca3af" font-size="12">|</text>
      <text x="540" y="29" fill="#e5e7eb" font-size="12">软链接通过标签匹配</text>
      <text x="720" y="29" fill="#e5e7eb" font-size="12">|</text>
      <text x="740" y="29" fill="#10b981" font-size="12">支持向量检索</text>
    </g>
  </svg>
</div>

<div class="page-break"></div>

<!-- Slide 2: 递归Task树 -->
<div class="slide">
  <div class="slide-title">mem0ress 架构设计</div>
  <h1>递归任务树结构</h1>
  <p class="slide-desc">每个子任务也是Task，拥有自己的Picture、Status、Subtasks。任务树是动态的，Picture达成即完成。</p>

      <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1a1a2e"/>
        <stop offset="100%" stop-color="#16213e"/>
      </linearGradient>
      <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
      </filter>
    </defs>

    <rect x="20" y="20" width="1060" height="540" rx="16" fill="url(#bgGrad2)"/>

    <!-- Root Task -->
    <g transform="translate(420, 40)" filter="url(#shadow2)">
      <rect width="260" height="90" rx="12" fill="#6366f1"/>
      <text x="20" y="30" fill="white" font-size="13" font-weight="600">Task: 项目X上线</text>
      <text x="20" y="48" fill="#c7d2fe" font-size="11">picture: "日活1万, 零重大故障"</text>
      <rect x="20" y="60" width="80" height="20" rx="10" fill="#818cf8"/>
      <text x="32" y="74" fill="white" font-size="10">in-progress</text>
      <circle cx="220" cy="70" r="6" fill="#fbbf24"/>
      <text x="200" y="74" fill="#fbbf24" font-size="9">80%</text>
    </g>

    <!-- Connecting lines to children -->
    <path d="M 470 130 L 200 200" class="arrow" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowHeadPurple)"/>
    <path d="M 550 130 L 470 200" class="arrow" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowHeadPurple)"/>
    <path d="M 630 130 L 740 200" class="arrow" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowHeadPurple)"/>

    <!-- Level 1: Login Module -->

      <text x="15" y="24" fill="white" font-size="12" font-weight="600">Task: 支付模块</text>
      <text x="15" y="42" fill="#a5b4fc" font-size="10">picture: "支付安全"</text>
      <rect x="15" y="54" width="80" height="18" rx="9" fill="#f59e0b"/>
      <text x="23" y="66" fill="white" font-size="9">in-progress</text>
      <circle cx="155" cy="63" r="5" fill="#fbbf24"/>
    </g>

      <rect width="180" height="90" rx="10" fill="#4f46e5"/>

<!-- Slide 3: Session 交互流程 -->
<div class="slide">
  <div class="slide-title">mem0ress 架构设计</div>
  <h1>AI 发现流程</h1>
  <p class="slide-desc">Session开始时，AI通过对话发现当前Plane。不是"恢复"状态，而是发现此刻的状态。</p>

  <svg viewBox="0 0 1100 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1a1a2e"/>
        <stop offset="100%" stop-color="#16213e"/>
      </linearGradient>
      <marker id="arrowHeadIn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
      </marker>
    </defs>

    <rect x="20" y="20" width="1060" height="560" rx="16" fill="url(#bgGrad3)"/>

    <!-- Timeline -->
    <line x1="100" y1="80" x2="100" y2="520" stroke="#374151" stroke-width="2"/>
    <circle cx="100" cy="80" r="8" fill="#6366f1"/>
    <text x="120" y="84" fill="#e5e7eb" font-size="12" font-weight="600">Session 开始</text>
    <circle cx="100" cy="180" r="8" fill="#8b5cf6"/>
