# mem0ress Protocol — Machine Operational Projection
# Derived from schema.md. All semantics reference schema.md.
# MUST NOT introduce semantics absent from schema.md.

---

schema_ref: ./schema.md

current_task_id:
  type: task_id | null | ''
  description: 当前活跃任务的标识符。无则 null，显式清空则 ''
  persistence: workspace-level registry (.cap/.task_info)

states:
  - CREATED
  - IN_PROGRESS
  - VERIFYING
  - COMPLETED
  - ABANDONED

transitions:
  CREATED:
    - IN_PROGRESS
    - ABANDONED
  IN_PROGRESS:
    - VERIFYING
    - COMPLETED
    - ABANDONED
  VERIFYING:
    - COMPLETED
    - IN_PROGRESS
    - ABANDONED
  COMPLETED: []
  ABANDONED: []

tiers:
  tier0:
    check: constraint_violations
    on_fail: RECORD_ONLY
    description: 参考信号，状态记录，不阻塞
  tier1:
    check: todo_completion
    on_fail: RECORD_ONLY
    description: 参考约束，状态记录，不阻塞
  tier2:
    check: requirement_validation
    on_fail: RECORD_ONLY
    description: 评估参考，状态记录，逐步满足
  tier3:
    check: semantic_alignment
    on_fail: PASS_FAIL_UNCERTAIN
    description: 唯一硬门槛，FAIL → amend 循环
    trigger_conditions:
      - picture_has_subjective_terms
      - constraint_picture_ambiguity
      - explicit_request

timeouts:
  verifying: 180
  tier3_default: 300

constraints:
  no_concurrent_session_writes: true
  no_multi_agent_same_task: true
  no_cross_workspace_dependencies: true
  verifying_is_transient: true

files:
  task: task.md
  session: session.md
  gotchas: gotchas.md
  judge: judge.md
  verify: verify.md


